<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#ff477e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle neural grid lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4,6">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Glow circles in background -->
  <circle cx="1060" cy="180" r="160" fill="#00f5d4" opacity="0.05" filter="url(#glow)"/>
  <circle cx="180" cy="300" r="120" fill="#ff758f" opacity="0.04" filter="url(#glow)"/>

  <!-- Right Side Visual Illustration: Neural Circuit & Dual-Modal Interception -->
  <g transform="translate(780, 50)">
    <!-- Circuit frame card -->
    <rect x="0" y="0" width="370" height="320" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title inside card -->
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">INTERNAL SAFETY CIRCUIT ARCHITECTURE</text>
    
    <!-- Modality inputs -->
    <rect x="25" y="55" width="85" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="67" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Vision (ViT)</text>

    <rect x="25" y="105" width="85" height="34" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="67" y="126" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Text Tokens</text>

    <!-- Connector lines -->
    <path d="M 110 72 L 145 92" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 110 122 L 145 92" stroke="#a78bfa" stroke-width="1.5" fill="none"/>

    <!-- Projection / Fusion block -->
    <rect x="145" y="75" width="65" height="38" rx="6" fill="#0f172a" stroke="#00f5d4" stroke-width="1.2"/>
    <text x="177" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#00f5d4" text-anchor="middle">Cross-Modal</text>
    <text x="177" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Projection</text>

    <line x1="210" y1="94" x2="235" y2="94" stroke="#00f5d4" stroke-width="1.5"/>

    <!-- LLM Layers block -->
    <rect x="235" y="48" width="110" height="235" rx="10" fill="#0b1329" stroke="#475569" stroke-width="1.5"/>
    <text x="290" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Transformer Layers</text>

    <!-- Neurons visualization inside LLM -->
    <!-- Layer 1 -->
    <circle cx="260" cy="100" r="6" fill="#475569"/>
    <circle cx="260" cy="120" r="6" fill="#475569"/>
    <circle cx="260" cy="140" r="6" fill="#475569"/>
    <circle cx="260" cy="160" r="6" fill="#475569"/>

    <!-- Layer 2: Safety Neurons Highlighted -->
    <circle cx="290" cy="100" r="7" fill="#00f5d4" filter="url(#glow)"/>
    <circle cx="290" cy="120" r="5" fill="#475569"/>
    <circle cx="290" cy="140" r="7" fill="#ff758f" filter="url(#glow)"/>
    <circle cx="290" cy="160" r="5" fill="#475569"/>

    <!-- Layer 3 -->
    <circle cx="320" cy="100" r="6" fill="#475569"/>
    <circle cx="320" cy="120" r="7" fill="#00f5d4"/>
    <circle cx="320" cy="140" r="6" fill="#475569"/>
    <circle cx="320" cy="160" r="7" fill="#38bdf8"/>

    <!-- Neural connection lines -->
    <path d="M 266 100 L 283 100" stroke="#00f5d4" stroke-width="1.2" opacity="0.8"/>
    <path d="M 266 140 L 283 140" stroke="#ff758f" stroke-width="1.2" opacity="0.8"/>
    <path d="M 297 100 L 314 120" stroke="#00f5d4" stroke-width="1.2" opacity="0.8"/>
    <path d="M 297 140 L 314 160" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>

    <!-- Safety Intervention Callout -->
    <rect x="250" y="190" width="82" height="24" rx="4" fill="#0f172a" stroke="#00f5d4" stroke-width="1"/>
    <text x="291" y="206" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#00f5d4" text-anchor="middle">CARE / ASTRA</text>

    <!-- Dual Pathways Output -->
    <rect x="245" y="225" width="90" height="20" rx="4" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="290" y="239" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#a7f3d0" text-anchor="middle">Safe Refusal</text>

    <rect x="245" y="250" width="90" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="290" y="264" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#fecaca" text-anchor="middle">Jailbreak Bypass</text>

    <!-- Legend bar at bottom -->
    <rect x="25" y="288" width="320" height="20" rx="4" fill="#0b1120"/>
    <circle cx="45" cy="298" r="4" fill="#00f5d4"/>
    <text x="55" y="301" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8">Safety Neurons</text>
    <circle cx="150" cy="298" r="4" fill="#ff758f"/>
    <text x="160" y="301" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8">Unsafe Channels</text>
    <circle cx="260" cy="298" r="4" fill="#38bdf8"/>
    <text x="270" y="301" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8">Steering Vector</text>
  </g>

  <!-- Left Side: Title, Subtitle, Academic Metadata & Badges -->
  <g transform="translate(60, 55)">
    <!-- Overline Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#00f5d4"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">SYSTEMATIC LITERATURE REVIEW</text>
    <text x="232" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#00f5d4">PRISMA 2020</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Mechanistic Interpretability of
    </text>
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#cyanGrad)" letter-spacing="-0.5">
      Safety Neurons in Vision-Language Models
    </text>

    <!-- Subtitle -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      A Structured Literature Review of Probing, Activation Patching, and Localized Safety Representations
    </text>

    <!-- Academic Metadata Pill Card -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="670" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Researcher & Reg No -->
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">RESEARCHER</text>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Snigdha Gorai</text>
      <text x="130" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">(24BCE7185)</text>

      <line x1="230" y1="15" x2="230" y2="60" stroke="#334155" stroke-width="1"/>

      <!-- Institution & Course -->
      <text x="250" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">INSTITUTION &amp; COURSE</text>
      <text x="250" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">VIT-AP University</text>
      <text x="365" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">| CSE4006 Deep Learning</text>

      <line x1="515" y1="15" x2="515" y2="60" stroke="#334155" stroke-width="1"/>

      <!-- Academic Year & Task -->
      <text x="535" y="26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">ASSESSMENT</text>
      <text x="535" y="48" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#00f5d4">DA-2 &amp; DA-3 (2026–27)</text>
    </g>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Identified: </text>
      <text x="82" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8">46 Records</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="159" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Screened: </text>
      <text x="222" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#a78bfa">38 Unique</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="304" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Full Texts: </text>
      <text x="372" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">16 Assessed</text>

      <!-- Pill 4 -->
      <rect x="445" y="0" width="150" height="28" rx="6" fill="#042f2e" stroke="#00f5d4" stroke-width="1.2"/>
      <circle cx="459" cy="14" r="4" fill="#00f5d4"/>
      <text x="470" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f5d4">Core Synthesis: 8</text>
    </g>
  </g>
</svg>